name: gitleaks
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Canary self-test
        run: mkdir -p /tmp/c && echo "k=xai-FAKEFAKEFAKEFAKEFAKEFAKE00" > /tmp/c/x && ! ./gitleaks dir /tmp/c --redact --no-banner -c .gitleaks.toml
      - name: Scan git history (redacted)
        run: ./gitleaks git . --redact --no-banner -c .gitleaks.toml -v
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Scan built dist (redacted)
        run: ./gitleaks dir dist --redact --no-banner -c .gitleaks.toml

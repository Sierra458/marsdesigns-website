name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Reject committed env files
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            base="$(basename "$file")"
            case "$base" in
              .env.example) ;;
              .env|.env.*|*.env)
                echo "::error file=${file}::committed env file is not allowed"
                bad=1
                ;;
            esac
          done < <(git ls-files)
          exit "$bad"
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm -f "$archive"
      - name: Canary self-test
        run: |
          set -euo pipefail
          mkdir -p /tmp/c /tmp/c-ok
          # Assemble fixtures in the shell so this file does not contain a matchable secret.
          printf 'k=xai-%s00\n' "$(printf 'FAKE%.0s' {1..5})" > /tmp/c/x
          printf 'password = "%s"\n' "fakepass" > /tmp/c/pw.txt
          printf '%s password = "%s"\n' "export const" "fakepass" > /tmp/c/pw-const.js
          printf '{"password":"%s"}\n' "jsonpass" > /tmp/c/pw.json
          printf 'PASSWORD=%s\n' "fakeenvvalue" > /tmp/c/.env
          printf 'PASS=%s\n' "fakeinivalue" > /tmp/c/app.ini
          printf 'DB_PASSWORD=%s\n' "fakedbvalue" > /tmp/c/db.env
          printf 'STRIPE_SECRET_KEY=%s\n' "fakestripevalue" >> /tmp/c/db.env
          printf 'PASSWORD=changeme\n' > /tmp/c-ok/.env
          printf 'SECRET=${NOT_REAL}\nPASS=xxx\nPASSWORD=your_placeholder\nSECRET=<secret>\n' >> /tmp/c-ok/.env
          printf 'DB_PASSWORD=changeme\n' >> /tmp/c-ok/.env
          printf 'PASSWORD=changeme\n' > /tmp/c-ok/local.env
          printf 'PASS=xxx\n' > /tmp/c-ok/ok.ini
          printf '%s\n' 'password = typeof body.password' > /tmp/c-ok/typeof.js
          set +e
          out=$(./gitleaks dir /tmp/c --redact --no-banner -c .gitleaks.toml -v --exit-code 99 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 99 ]; then
            echo "canary exit ${status}, expected 99" >&2
            exit 1
          fi
          for rule in xai-key password-line env-unquoted-secret; do
            printf '%s\n' "$out" | grep -F "$rule" >/dev/null || { echo "canary output missing ${rule}" >&2; exit 1; }
          done
          if [ "$(printf '%s\n' "$out" | grep -c 'RuleID:.*password-line')" -lt 3 ]; then
            echo "canary did not catch every quoted password form" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$out" | grep -c 'RuleID:.*env-unquoted-secret')" -lt 4 ]; then
            echo "canary did not catch DB_PASSWORD and STRIPE_SECRET_KEY" >&2
            exit 1
          fi
          if printf '%s\n' "$out" | grep -F 'FAKEFAKEFAKEFAKEFAKE' >/dev/null; then
            echo "canary printed the xai fixture" >&2
            exit 1
          fi
          if printf '%s\n' "$out" | grep -F 'fakepass' >/dev/null; then
            echo "canary printed the password fixture" >&2
            exit 1
          fi
          if printf '%s\n' "$out" | grep -E 'fakeenvvalue|fakeinivalue|fakedbvalue|fakestripevalue|jsonpass' >/dev/null; then
            echo "canary printed a secret fixture" >&2
            exit 1
          fi
          set +e
          ok_out=$(./gitleaks dir /tmp/c-ok --redact --no-banner -c .gitleaks.toml -v --exit-code 99 2>&1)
          ok_status=$?
          set -e
          if [ "$ok_status" -ne 0 ]; then
            echo "passing fixture was flagged (exit ${ok_status})" >&2
            exit 1
          fi
          if printf '%s\n' "$ok_out" | grep -E 'env-unquoted-secret|password-line' >/dev/null; then
            echo "passing fixture matched a secret rule" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - name: Scan history and built dist (redacted)
        run: |
          set -euo pipefail
          fail=0
          ./gitleaks git . --redact --no-banner -c .gitleaks.toml -v || fail=1
          ./gitleaks dir dist --redact --no-banner -c .gitleaks.toml -v || fail=1
          exit "$fail"
      - name: Notice guard config changes
        if: always()
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          watch=(
            .gitleaks.toml
            .gitleaksignore
            .copy-guard-allow
            scripts/copy-guard.py
            .github/workflows/copy-guard.yml
            .github/workflows/gitleaks.yml
          )
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            range="origin/${GITHUB_BASE_REF}...HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${GITHUB_EVENT_BEFORE}...HEAD"
          else
            git fetch --no-tags origin main
            range="origin/main...HEAD"
          fi
          changed="$(git diff --name-only "$range" -- "${watch[@]}" || true)"
          {
            echo "## Guard config"
            if [ -n "$changed" ]; then
              echo "Changed guard files:"
              printf '%s\n' "$changed" | sed 's/^/- /'
            else
              echo "No watched guard files changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "::notice file=${file}::Guard config changed"
            done <<< "$changed"
          fi

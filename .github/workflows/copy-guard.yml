name: copy-guard
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  copy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Notice guard-config changes
        run: scripts/guard-config-notice.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Fixture self-test
        run: python3 scripts/copy-guard.py --self-test
      - name: Scan built HTML (JSON-LD and meta) and voice instructions
        run: python3 scripts/copy-guard.py dist api/_voice-instructions*
